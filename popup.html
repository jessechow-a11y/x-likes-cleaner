<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Likes Cleaner</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:330px;margin:0;padding:16px;color:#111}
  h1{font-size:18px;margin:0 0 8px}
  .sub{font-size:12px;color:#666;line-height:1.45;margin:0 0 14px}
  label{display:block;font-size:12px;font-weight:600;margin:10px 0 5px}
  select,input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  button{border:0;border-radius:9px;padding:10px;font-size:13px;cursor:pointer}
  #start{background:#111;color:white}
  #pause{background:#eee}
  #stop{background:#f2dede}
  .stats{margin-top:12px;padding:12px;border-radius:10px;background:#f6f6f6}
  .bigrow{display:flex;align-items:baseline;gap:4px}
  .big{font-size:22px;font-weight:700}
  .bigsep{font-size:16px;color:#999;font-weight:600}
  .biglimit{font-size:16px;color:#666;font-weight:600}
  .small{font-size:11px;color:#666;margin-top:2px}
  .bar{height:8px;background:#ddd;border-radius:99px;overflow:hidden;margin-top:9px}
  .bar>div{height:100%;width:0;background:#111;transition:width .2s}
  .metrics{display:flex;gap:10px;margin-top:12px}
  .metric{flex:1;background:#fff;border:1px solid #eee;border-radius:8px;padding:8px}
  .metric .v{font-size:16px;font-weight:700}
  .metric .l{font-size:10.5px;color:#888;margin-top:2px}
  #status{margin-top:12px;font-size:12px;line-height:1.45}
  .warn{font-size:11px;color:#7a4d00;margin-top:12px;line-height:1.45}
  #limitCustomWrap{margin-top:6px}
</style>
</head>
<body>
<h1>❤️ X Likes Cleaner</h1>
<p class="sub">本工具在当前浏览器页面本地运行，不需要账号密码，不上传账号数据。</p>

<label for="speed">操作速度</label>
<select id="speed">
  <option value="900">稳妥：约 0.9–1.6 秒/次</option>
  <option value="650" selected>较快：约 0.65–1.25 秒/次</option>
  <option value="450">快速：约 0.45–1.0 秒/次</option>
</select>

<label for="limit">本轮最多取消多少个</label>
<select id="limit">
  <option value="100" selected>100</option>
  <option value="500">500</option>
  <option value="1000">1,000</option>
  <option value="5000">5,000</option>
  <option value="10000">10,000</option>
  <option value="custom">自定义…</option>
</select>
<div id="limitCustomWrap" style="display:none">
  <input id="limitCustom" type="number" min="1" max="100000" value="200" placeholder="输入自定义数量">
</div>

<div class="row" style="margin-top:10px">
  <button id="start">开始 / 继续</button>
  <button id="pause">暂停</button>
  <button id="stop">停止</button>
</div>

<div class="stats">
  <div class="bigrow">
    <span class="big" id="count">0</span>
    <span class="bigsep">/</span>
    <span class="biglimit" id="limitDisplay">100</span>
  </div>
  <div class="small">本轮进度</div>
  <div class="bar"><div id="bar"></div></div>

  <div class="metrics">
    <div class="metric">
      <div class="v" id="discovered">0</div>
      <div class="l">已发现帖子</div>
    </div>
    <div class="metric">
      <div class="v" id="elapsed">00:00</div>
      <div class="l">运行时间</div>
    </div>
  </div>

  <div id="status">状态：等待开始</div>
</div>

<div class="warn">
注意：X 页面结构或平台规则变化可能导致功能失效。请先小批量测试，避免长时间连续自动操作。"本轮上限"仅为本插件自定的处理批次，并非 X 官方规定的数量限制。
</div>

<script src="popup.js"></script>
</body>
</html>
